services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: merge_pipeline
      MYSQL_USER: merge_pipeline
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secure-password}
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: .docker/prod/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: merge_pipeline
      DB_USER: merge_pipeline
      DB_PASSWORD: ${DB_PASSWORD:-secure-password}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-dev-encryption-key}
      REPOSITORY_CACHE_ROOT: /var/lib/merge-pipeline/repositories
    volumes:
      - repository_cache:/var/lib/merge-pipeline:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: ../..
      dockerfile: .docker/prod/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: merge_pipeline
      DB_USER: merge_pipeline
      DB_PASSWORD: ${DB_PASSWORD:-secure-password}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-dev-encryption-key}
      REPOSITORY_CACHE_ROOT: /var/lib/merge-pipeline/repositories
    volumes:
      - repository_cache:/var/lib/merge-pipeline
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=2

  beat:
    build:
      context: ../..
      dockerfile: .docker/prod/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: merge_pipeline
      DB_USER: merge_pipeline
      DB_PASSWORD: ${DB_PASSWORD:-secure-password}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-dev-encryption-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  flower:
    image: mher/flower:2.0.1
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  repository_cache:
