[tool.ruff]
target-version = "py312"
line-length = 110
src = ["."]
exclude = ["migrations", ".venv", "staticfiles", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # bandit (security)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle
]
ignore = [
    "D100",  # Missing docstring in public module (handled at package level)
    "D101",  # Missing docstring in public class
    "D104",  # Missing docstring in public package
    "D203",  # Conflicts with D211 (blank line before class docstring)
    "S101",  # assert allowed (test code)
    "S105",  # hardcoded password string (settings defaults)
    "S106",  # hardcoded password argument
    "S324",  # pbkdf2 aware
    "E501",  # line length enforced by black
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]  # security checks are not meaningful for tests
"*/tests/**/*.py" = ["S"]
"config/settings/*.py" = ["S"]
"manage.py" = ["S"]
"apps/**/tests.py" = ["D"]
"apps/**/admin.py" = ["D"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "config.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*", "pymysql.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::RuntimeWarning"]

[tool.bandit]
targets = ["apps", "config"]
exclude_dirs = ["migrations", ".venv", "staticfiles"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/tests/*", "*/migrations/*", "config/settings/*", "config/celery.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
