name: merge-pipeline-dev

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: merge_pipeline
      MYSQL_USER: merge_pipeline
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secure-password}
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: .docker/dev/Dockerfile
    env_file:
      - ../../.env
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: merge_pipeline
      DB_USER: merge_pipeline
      DB_PASSWORD: ${DB_PASSWORD:-secure-password}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ../..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: ../..
      dockerfile: .docker/dev/Dockerfile
    env_file:
      - ../../.env
    environment:
      <<: *app-environment
      OPENCODE_CONFIG: /etc/opencode/opencode.jsonc
    volumes:
      - ../..:/app
      - ./opencode.jsonc:/etc/opencode/opencode.jsonc:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=2

  beat:
    build:
      context: ../..
      dockerfile: .docker/dev/Dockerfile
    env_file:
      - ../../.env
    environment: *app-environment
    volumes:
      - ../..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  flower:
    image: mher/flower:2.0.1
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: "5555"
    ports:
      - "127.0.0.1:5556:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  dev_mysql_data:
  dev_redis_data:
